name: Tests

# Roda a suite de testes automatizados (NvdaRemoteDroid.Tests.Unit) a cada push/PR na branch
# main. Só restaura/testa o projeto de testes (que referencia NvdaRemoteDroid.Core via
# ProjectReference, ambos net10.0 puro) — não precisa do workload maui-android nem de
# emulador, por isso não toca em NvdaRemoteDroid.csproj (net10.0-android).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NvdaRemoteDroid.Tests.Unit/NvdaRemoteDroid.Tests.Unit.csproj

      - name: Run unit tests
        run: >
          dotnet test NvdaRemoteDroid.Tests.Unit/NvdaRemoteDroid.Tests.Unit.csproj
          --no-restore --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
